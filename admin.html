<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Admin — Shem Mwendwa Kyalo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #14171c;
      --ink-2: #1b1f26;
      --paper: #edeae3;
      --slate: #8b93a1;
      --spruce: #2f8f5b;
      --amber: #e0a458;
      --line: #2a2f38;
      --danger: #d64545;
      --mono: 'JetBrains Mono', monospace;
      --display: 'Space Grotesk', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--ink);
      color: var(--paper);
      font-family: var(--mono);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--ink-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
    }

    h1 {
      font-family: var(--display);
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    .sub {
      color: var(--slate);
      font-size: 0.85rem;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: var(--amber);
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }

    .field {
      margin-bottom: 20px;
    }

    select,
    input[type=password] {
      width: 100%;
      background: var(--ink);
      border: 1px solid var(--line);
      color: var(--paper);
      padding: 12px 14px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 0.95rem;
    }

    select:focus,
    input:focus {
      outline: 2px solid var(--spruce);
      outline-offset: 1px;
    }

    .dropzone {
      border: 1.5px dashed var(--line);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s;
      position: relative;
      overflow: hidden;
    }

    .dropzone.has-image {
      border-style: solid;
      border-color: var(--spruce);
    }

    .dropzone input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .dropzone .hint {
      color: var(--slate);
      font-size: 0.85rem;
    }

    .preview {
      max-width: 100%;
      max-height: 220px;
      border-radius: 6px;
      display: none;
      margin: 0 auto 12px;
    }

    button {
      width: 100%;
      background: var(--spruce);
      color: var(--ink);
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-family: var(--mono);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }

    button:hover:not(:disabled) {
      background: #39a56b;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      font-size: 0.85rem;
      text-align: center;
      min-height: 20px;
    }

    .status.ok {
      color: var(--spruce);
    }

    .status.err {
      color: var(--danger);
    }

    a.back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--slate);
      font-size: 0.8rem;
    }

    a.back:hover {
      color: var(--amber);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Gallery admin</h1>
    <div class="sub">Upload a photo straight from your phone. It replaces whatever is currently in that slot.</div>

    <form id="uploadForm">
      <div class="field">
        <label for="slot">SLOT (1–5)</label>
        <select id="slot" required>
          <option value="1">1 — Engagement</option>
          <option value="2">2 — Portrait</option>
          <option value="3">3 — Collaboration</option>
          <option value="4">4 — Occasions</option>
          <option value="5">5 — Adventure</option>
        </select>
      </div>

      <div class="field">
        <label for="photo">PHOTO</label>
        <div class="dropzone" id="dropzone">
          <img class="preview" id="preview" alt="">
          <div class="hint" id="hint">Tap to choose a photo from your phone</div>
          <input type="file" id="photo" accept="image/*" required>
        </div>
      </div>

      <div class="field">
        <label for="password">PASSWORD</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>

      <button type="submit" id="submitBtn">Upload photo</button>
      <div class="status" id="status"></div>
    </form>

    <a class="back" href="/index.html">← back to site</a>
  </div>

  <script>
    const photo = document.getElementById('photo');
    const preview = document.getElementById('preview');
    const hint = document.getElementById('hint');
    const dropzone = document.getElementById('dropzone');
    const form = document.getElementById('uploadForm');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    let base64Image = null;

    function resizeImage(file, maxDim = 1600, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = (e) => { img.src = e.target.result; };
        reader.onerror = reject;
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxDim) {
            height = Math.round(height * (maxDim / width)); width = maxDim;
          } else if (height > maxDim) {
            width = Math.round(width * (maxDim / height)); height = maxDim;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    photo.addEventListener('change', async () => {
      const file = photo.files[0];
      if (!file) return;
      hint.textContent = 'Preparing photo…';
      try {
        base64Image = await resizeImage(file);
        preview.src = base64Image;
        preview.style.display = 'block';
        hint.textContent = file.name;
        dropzone.classList.add('has-image');
      } catch (err) {
        hint.textContent = 'Could not read that photo, try another.';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!base64Image) {
        statusEl.textContent = 'Choose a photo first.';
        statusEl.className = 'status err';
        return;
      }
      const slot = document.getElementById('slot').value;
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Uploading…';
      statusEl.textContent = '';
      statusEl.className = 'status';

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slot, password, image: base64Image })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Upload failed');

        statusEl.textContent = `Slot ${slot} updated. It may take a few seconds to show on the site.`;
        statusEl.className = 'status ok';
        form.reset();
        preview.style.display = 'none';
        hint.textContent = 'Tap to choose a photo from your phone';
        dropzone.classList.remove('has-image');
        base64Image = null;
      } catch (err) {
        statusEl.textContent = err.message;
        statusEl.className = 'status err';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Upload photo';
      }
    });
  </script>
</body>

</html>
